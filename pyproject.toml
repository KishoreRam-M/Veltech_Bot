[project]
name = "veltech-counselor"
version = "2.0.0"
description = "AI Admissions Counselor for Vel Tech Multi Tech Engineering College - Hybrid Intel-Optimized"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "google-genai>=1.0.0",
    "rank-bm25>=0.2.2",
    "numpy<2.0.0",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=3.0.0",
    "aiofiles>=24.1.0",
    "lancedb>=0.6.0",
    "psutil>=5.9.0",
    "pyttsx3>=2.90",
    "transformers>=4.48.0",
    "accelerate>=0.27.0",
    "sentencepiece>=0.1.99",
    "python-multipart>=0.0.9",
    "faster-whisper>=1.2.1",
    "edge-tts>=6.1.0",
    "asyncio>=4.0.0",
    "crewai>=0.80.0",
]

[tool.uv]
extra-index-url = ["https://download.pytorch.org/whl/cpu"]
